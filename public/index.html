<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>Room Survey — Home Away Inn</title>
<style>
:root{
  color-scheme: only light;   /* stops Android/Chrome from inverting the report */
  --ink:#111a21;
  --ink-2:#1d2b35;
  --paper:#f6f5f1;
  --card:#ffffff;
  --line:#dcdad2;
  --line-2:#c4c1b6;
  --text:#1b2229;
  --muted:#6a7079;
  --complete:#1f7a5c;
  --progress:#b5810c;
  --needs:#bc4423;
  --notdone:#8a8f97;
  --focus:#2f6fd0;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- chrome ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px;
}
.topbar h1{
  margin:0;font-size:15px;font-weight:650;letter-spacing:.02em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar .sub{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;opacity:.6;letter-spacing:.06em;text-transform:uppercase}
.iconbtn{
  background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:8px;
  min-width:44px;height:38px;padding:0 11px;font-size:13px;font-weight:600;cursor:pointer;
}
.iconbtn:active{background:rgba(255,255,255,.22)}

.wrap{max-width:820px;margin:0 auto;padding:14px 14px 90px}
body.inroom .wrap{padding-bottom:126px}

/* ---------- status tokens ---------- */
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.s-complete{background:var(--complete)}
.s-progress{background:var(--progress)}
.s-needs{background:var(--needs)}
.s-notdone{background:var(--notdone)}
.chip{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:4px 10px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);
}

/* ---------- summary strip ---------- */
.strip{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px;
}
.strip button{
  background:var(--card);border:0;padding:9px 4px 10px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.strip button[aria-pressed="true"]{background:var(--ink);color:#fff}
.strip .n{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1}
.strip .l{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;line-height:1.15}

.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow input{
  flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;
}

/* ---------- room board ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{
  position:relative;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--notdone);
  border-radius:10px;padding:10px 10px 9px;text-align:left;cursor:pointer;min-height:74px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.tile:active{background:#f0efea}
.tile.pressing{transform:scale(.96);opacity:.8;transition:transform .12s ease,opacity .12s ease}
.tile.picked{outline:3px solid var(--needs);outline-offset:-1px;background:#fbeee9}
.pickcount{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px}
.tile.b-complete{border-left-color:var(--complete)}
.tile.b-progress{border-left-color:var(--progress)}
.tile.b-needs{border-left-color:var(--needs)}
.tile.b-notdone{border-left-color:var(--notdone)}
.tile .num{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile .ty{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .meta{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px}
.tile .flag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;color:var(--needs);font-family:var(--mono)}

/* ---------- cards / sections ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card > h2{
  margin:0;padding:11px 13px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fbfaf7;
}
.card .body{padding:12px 13px}
.card .body.tight{padding:0}

label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{
  border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:11px 14px;
  font-weight:600;font-size:14px;cursor:pointer;min-height:44px;
}
.btn:active{background:#efeee9}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--needs);border-color:#e2b7a9}
.btn.full{width:100%}
.btn.sm{padding:7px 11px;min-height:36px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- list rows ---------- */
.row{
  display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;font-size:14.5px;word-break:break-word}
.row .sub{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.row .note{font-size:13px;color:var(--muted);margin-top:3px;word-break:break-word}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}

.statusbtn{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;font-size:11.5px;
  font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;min-height:34px;
}
.statusbtn.v-complete{border-color:#a6cfc0;background:#eaf5f0;color:#155e46}
.statusbtn.v-progress{border-color:#e5cf9a;background:#fbf4e3;color:#7d5a06}
.statusbtn.v-needs{border-color:#e6b8a8;background:#fbeee9;color:#93341a}
.statusbtn.v-notdone{border-color:var(--line);background:#f4f3ef;color:#5f656d}

/* ---------- photos ---------- */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#e9e8e3}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{
  position:absolute;top:3px;right:3px;background:rgba(10,15,20,.72);color:#fff;border:0;
  width:26px;height:26px;border-radius:6px;font-size:15px;line-height:1;cursor:pointer;
}
.counter{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}

/* ---------- quick add chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{
  border:1px dashed var(--line-2);background:#fff;border-radius:999px;padding:7px 11px;
  font-size:12.5px;cursor:pointer;min-height:36px;
}
.chips button:active{background:#eceae4}
.chips button.on{background:var(--ink);color:#fff;border-style:solid;border-color:var(--ink)}
.chips button.on::before{content:'✓ ';font-weight:700}
.chips button.warn{border-color:var(--needs);color:var(--needs)}
/* to-do */
.sym{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:22px;height:22px;border-radius:6px;font-size:13px;font-weight:700;line-height:1;
}
.t-miss{background:#fbeee9;color:#a8391a;border:1px solid #e6b8a8}
.t-short{background:#fbf4e3;color:#7d5a06;border:1px solid #e5cf9a}
.t-job{background:#eaeff6;color:#2b4a72;border:1px solid #bcccdf}
.t-photo{background:#eef0f2;color:#4a5560;border:1px solid #ccd2d8}
.t-open{background:#f2f1ee;color:#5f656d;border:1px solid #d8d5cc}
.todoline{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.todoline:last-child{border-bottom:0}
.todoline .tx{flex:1;min-width:120px;font-size:14px;word-break:break-word}
.todoline .acts{display:flex;gap:6px;flex:none}
.todoline .acts .btn{min-height:36px;padding:6px 10px;font-size:12.5px}
.todohead{
  display:flex;align-items:center;gap:9px;width:100%;background:#fbfaf7;border:0;
  border-bottom:1px solid var(--line);padding:11px 13px;cursor:pointer;text-align:left;
}
.todohead .rn{font-family:var(--mono);font-size:16px;font-weight:600;flex:none}
.todohead .rt{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todohead .cnt{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--needs);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.legend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.tilesyms{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tilesyms .s{
  display:inline-flex;align-items:center;gap:2px;font-size:10.5px;font-weight:700;
  padding:1px 5px;border-radius:5px;font-family:var(--mono);
}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.navrow .pos{font-family:var(--mono);font-size:12px;color:var(--muted)}
.navrow .btn{min-width:90px}
.qline{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.qbtn{width:34px;height:34px;border:1px solid var(--line-2);background:#fff;border-radius:7px;
  font-size:17px;font-weight:700;line-height:1;cursor:pointer;flex:none}
.qline .q{font-family:var(--mono);font-size:14px;font-weight:700;min-width:20px;text-align:center}
.condbtn{border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;
  font-weight:700;cursor:pointer;min-height:34px;background:#fff}
.c-Good{background:#eaf5f0;color:#155e46;border-color:#a6cfc0}
.c-Fair{background:#fbf4e3;color:#7d5a06;border-color:#e5cf9a}
.c-Poor{background:#fbeee9;color:#93341a;border-color:#e6b8a8}
.c-Damaged{background:#f7e2da;color:#7c2d12;border-color:#dda58f}
.c-Missing{background:#f0efeb;color:#5f656d;border-color:#d8d5cc}
.stdrow{display:flex;align-items:center;gap:8px;padding:8px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;border-radius:7px}
.stdrow:last-child{border-bottom:0}
.stdrow.st-missing{background:#fbeee9}
.stdrow.st-short{background:#fbf4e3}
.stdrow.st-present{opacity:.62}
.stdrow .nm{flex:1;min-width:130px;font-weight:600;font-size:14px}
.stdrow .need{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:600}
.stdrow .tag{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;margin-top:2px}
.t-unchecked{color:var(--muted)}
.t-present{color:var(--complete)}
.t-short{color:var(--progress)}
.t-missing{color:var(--needs)}
.stdrow .bs{display:flex;gap:6px}
.btn.pick{background:var(--complete);border-color:var(--complete);color:#fff}
.btn.pickbad{background:var(--needs);border-color:var(--needs);color:#fff}
.catlabel{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;width:100%;margin:6px 0 1px}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,18,24,.5);z-index:60;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);
  border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;display:none;
  padding:16px 14px calc(20px + env(safe-area-inset-bottom));
}
.sheet.on{display:block}
.sheet h3{margin:2px 0 14px;font-size:17px}
.sheetgrab{width:38px;height:4px;background:var(--line-2);border-radius:2px;margin:0 auto 12px}

.lightbox{position:fixed;inset:0;background:#0b0f13;z-index:80;display:none;align-items:center;justify-content:center;padding:12px}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:86vh;object-fit:contain}
.lightbox .close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:90;
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13.5px;font-weight:600;
  box-shadow:0 6px 24px rgba(0,0,0,.28);display:none;max-width:90vw;text-align:center;
}
.toast.on{display:block}

.savebar{
  position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);
  border-top:1px solid var(--line-2);display:flex;align-items:center;gap:10px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -3px 14px rgba(0,0,0,.09);
}
.savebar .msg{flex:1;min-width:0;font-size:12.5px;line-height:1.3;color:var(--muted)}
.savebar .msg strong{display:block;font-size:13.5px}
.savebar.dirty .msg strong{color:var(--needs)}
.savebar.clean .msg strong{color:var(--complete)}
.savebar button{min-width:130px}
body.printing .savebar{display:none!important}
.fab{
  position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;
  background:var(--ink);color:#fff;border:0;border-radius:999px;padding:14px 20px;
  font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.22);
}

.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.warnbar{
  background:#fbf4e3;border:1px solid #e5cf9a;border-radius:9px;padding:10px 12px;
  font-size:12.5px;color:#6d4f07;margin-bottom:12px;
}
.hidden{display:none!important}
/* ---------- report / print ---------- */
#reportRoot{display:none}
body.printing #reportRoot{display:block}
body.printing .wrap,body.printing .topbar,body.printing .fab{display:none!important}
.printbar{
  position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px;display:flex;gap:8px;align-items:center;
}
.printbar .t{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reportRoot,#reportRoot *{forced-color-adjust:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#reportRoot .doc{max-width:900px;margin:0 auto;padding:22px 16px 60px;background:#fff;color:#14181d}
#reportRoot h1,#reportRoot h2,#reportRoot td,#reportRoot strong{color:#14181d}
#reportRoot thead{display:table-header-group}   /* repeat column headers on every page */
#reportRoot tbody{display:table-row-group}
#reportRoot h1{font-size:23px;margin:0 0 4px;letter-spacing:-.01em}
#reportRoot .lead{color:#555b63;font-size:12.5px;margin:0 0 6px;font-family:var(--mono);line-height:1.6}
#reportRoot section{border-top:2px solid #14181d;padding:15px 0 20px;background:#fff}
#reportRoot header{display:flex;align-items:center;justify-content:space-between;gap:10px}
#reportRoot h2{font-size:18px;margin:0;break-after:avoid}
#reportRoot h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#555b63;margin:15px 0 5px;break-after:avoid}
#reportRoot .meta{color:#555b63;font-size:12px;margin:3px 0 0;font-family:var(--mono)}
#reportRoot .notes{background:#f2f1ec;border-left:3px solid #9b978c;padding:8px 11px;font-size:13px;margin:10px 0 0;break-inside:avoid;color:#14181d}
#reportRoot .miss{background:#fbeae4;border-left:3px solid #a8391a;padding:8px 11px;font-size:13px;margin:6px 0 0;break-inside:avoid;color:#5d2110;font-weight:600}
#reportRoot .up{background:#fbf1d8;border-left:3px solid #a8760b;padding:8px 11px;font-size:13px;margin:10px 0 0;break-inside:avoid;color:#4a3503}
#reportRoot .st{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
#reportRoot .st-complete{background:#eaf5f0;color:#155e46}
#reportRoot .st-progress{background:#fbf4e3;color:#7d5a06}
#reportRoot .st-needs{background:#fbeee9;color:#93341a}
#reportRoot .st-notdone{background:#f0efeb;color:#5f656d}
#reportRoot .pg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:11px}
#reportRoot .pg figure{margin:0;break-inside:avoid;page-break-inside:avoid}
#reportRoot .pg img{width:100%;height:auto;max-height:76mm;object-fit:contain;background:#f2f1ed;border:1px solid #b9b6ad;border-radius:4px;display:block}
#reportRoot table{width:100%;border-collapse:collapse;font-size:12.5px;break-inside:auto}
#reportRoot th{text-align:left;background:#eceae4;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#3c4148;font-weight:700}
#reportRoot th,#reportRoot td{border:1px solid #b9b6ad;padding:5px 7px;vertical-align:top;background-clip:padding-box}
#reportRoot td{background:#fff}
#reportRoot tr{break-inside:avoid}
#reportRoot .cover{border-top:0;padding-top:0}
#reportRoot .pagebreak{break-before:page;page-break-before:always}

@media print{
  html,body{background:#fff!important;color:#14181d!important}
  #reportRoot,#reportRoot .doc,#reportRoot section{background:#fff!important;color:#14181d!important}
  @page{margin:13mm}
  .topbar,.fab,.wrap,.sheet,.scrim,.toast,.printbar,.lightbox{display:none!important}
  #reportRoot{display:block!important}
  #reportRoot .doc{padding:0;max-width:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="iconbtn" id="backBtn" style="display:none">‹ Rooms</button>
  <h1 id="title">Room Survey<span class="sub" id="subtitle">Home Away Inn</span></h1>
  <button class="iconbtn" id="syncBtn">Sync</button>
  <button class="iconbtn" id="todoBtn">To-do</button>
  <button class="iconbtn" id="menuBtn">Menu</button>
</div>

<div class="wrap">
  <!-- BOARD -->
  <div id="boardView">
    <div id="filterBar" class="warnbar hidden" style="background:#eef3fb;border-color:#b9cbe8;color:#1e3a5f"></div>
    <div id="fileWarn" class="warnbar hidden" style="background:#fbeee9;border-color:#e6b8a8;color:#7c2d12"></div>
    <div id="backupWarn" class="warnbar hidden">
      You haven't backed up in a while. Menu → <strong>Save backup file</strong> keeps a copy off this phone.
    </div>

    <div class="strip" id="strip"></div>

    <div class="searchrow">
      <input type="text" id="search" placeholder="Search room or note" autocomplete="off">
      <select id="typeFilter" style="flex:none;width:41%"></select>
    </div>

    <div class="board" id="board"></div>
    <div id="boardEmpty" class="empty hidden">
      No rooms yet. Tap <strong>Add rooms</strong> to enter your room numbers.
    </div>
  </div>

  <!-- ROOM -->
  <div id="roomView" class="hidden"></div>

  <!-- TO-DO -->
  <div id="todoView" class="hidden"></div>
</div>

<button class="fab" id="fab">+ Add rooms</button>
<div class="savebar" id="saveBar" style="display:none">
  <span class="msg" id="saveMsg"></span>
  <button class="btn primary" id="saveRoom">Save room</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sheetgrab"></div><div id="sheetBody"></div></div>

<div class="lightbox" id="lightbox">
  <button class="iconbtn close" id="lbClose">Close</button>
  <img id="lbImg" alt="">
</div>

<script>
/* ============================================================

const STATUSES = [

  {k:'needs',    label:'Needs work'},
  {k:'complete', label:'Complete'}

/* Not let to guests, so the guest-room baseline doesn't apply. Only its own

const isGuestRoom = t => !NON_GUEST.includes(t);

  'Beds & linens':['Queen bed','King bed','Twin bed','Mattress','Box spring','Headboard','Pillows','Comforter','Blanket','Mattress protector'],
  'Furniture':['Nightstand','Dresser','Desk','Desk chair','Armchair','Side table','Luggage rack','Floor lamp','Table lamp','Mirror','Artwork'],
  'Appliances':['TV','TV remote','Mini fridge','Microwave','Coffee maker','AC unit','Heater','Hair dryer','Iron','Ironing board','Phone','Smoke detector'],
  'Bathroom':['Toilet','Sink','Vanity','Shower','Bathtub','Shower curtain','Towel bar','Toilet paper holder','Exhaust fan','Bath mat'],
  'Fixtures':['Ceiling light','Vanity light','Window blinds','Curtains','Curtain rod','Door lock','Deadbolt','Door stop','Outlet covers','Carpet','Vinyl flooring']
};

/* The property's baseline, as given by management. Loaded once, then owned

const DEFAULT_STANDARD = ['Bed','Microwave','Chair','Trash can','Fridge','TV','TV remote',

const WORK_PRESETS = ['Deep clean','Paint touch-up','Replace carpet','Fix plumbing leak','Replace light bulbs','Repair drywall','Replace door lock','Service AC unit','Replace linens','Caulk tub','Replace TV remote','Repair furniture'];

/* ---------------- storage ---------------- */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    if(!('indexedDB' in globalThis) || !indexedDB) return rej(new Error('no indexeddb'));
    const r = indexedDB.open('roomsurvey',1);
    const bail=setTimeout(()=>rej(new Error('timeout')),8000);
    r.onblocked=()=>{clearTimeout(bail);rej(new Error('blocked'))};
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos',{keyPath:'id'});
    };
    r.onsuccess = e=>{clearTimeout(bail);db=e.target.result;res()};
    r.onerror = ()=>{clearTimeout(bail);rej(r.error)};
  });
}
function tx(store,mode){return db.transaction(store,mode).objectStore(store)}
function idbGet(store,key){return new Promise((res,rej)=>{const q=tx(store,'readonly').get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function idbPut(store,val,key){return new Promise((res,rej)=>{const q=key!==undefined?tx(store,'readwrite').put(val,key):tx(store,'readwrite').put(val);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function idbDel(store,key){return new Promise((res,rej)=>{const q=tx(store,'readwrite').delete(key);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}

/* ---------------- state ---------------- */

/* Two guards live here, and both exist because ten rooms were lost:
   1. If startup could not read storage, we start blank — writing that blank
      state would destroy the real data. So we refuse to write at all.
   2. A jump from several rooms down to none is only ever legitimate right
      after the user deleted something. Otherwise it is a bug, and we stop. */
let staleWarned=false;
/* A restored backup or snapshot carries an old revision (or none at all), so
   the stale-window guard would refuse to write it. A deliberate restore must
   supersede whatever is on disk. */
async function supersede(){
  try{
    const prev=await idbGet('kv','state');
    state.rev=(prev&&Number.isFinite(prev.rev)?prev.rev:0)+1;
  }catch(e){ state.rev=(Number.isFinite(state.rev)?state.rev:0)+1; }
  staleWarned=false;
}
async function writeState(){
  if(!loadOK){ return; }
  try{
    const prev=await idbGet('kv','state');

    /* Another copy of the app — a second tab, or the home-screen version
       alongside the browser one — has written since we loaded. Ours is stale
       and would erase their work. */
    if(prev && Number.isFinite(prev.rev) && prev.rev > (state.rev||0)){
      if(!staleWarned){
        staleWarned=true;
        alert('Another copy of this app is open and has newer data.\n\nNothing was saved from this window, so the newer data is intact. Close this window and work in the other one, or reload this page to pick up the latest.');
      }
      return;
    }

    /* Rooms vanishing without a delete is a bug, not an instruction. */
    if(state.rooms.length===0 && prev && Array.isArray(prev.rooms) && prev.rooms.length>0
       && (Date.now()-deleteIntent>8000)){
      toast('Blocked an empty save — your rooms are safe. Menu → Recover');
      return;
    }

    state.rev=(Number.isFinite(state.rev)?state.rev:0)+1;
    await idbPut('kv',JSON.parse(JSON.stringify(state)),'state');
  }catch(e){
    const full = e && (e.name==='QuotaExceededError'||/quota|storage/i.test(e.message||''));
    alert(full
      ? 'Storage is full, so your last change was NOT saved.\n\nFree space by removing photos from finished rooms, or save a backup and start a fresh survey.'
      : 'Your last change could not be saved. Do not close the app — save a backup from the menu now.');
  }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(writeState,250);
}
function flushSave(){ clearTimeout(saveTimer); writeState(); }

const SEED_ID='2026-08-20-recovery';
const SNAP_KEEP=10;

/* One-time recovery load. The rooms rescued on 20 Aug are embedded in this
   file. They are applied only when storage is completely empty and only once,
   so nothing that already exists is ever touched. */
async function applySeed(){
  const el=document.getElementById('seedData');
  if(!el) return 0;
  let seed=null;
  try{ seed=JSON.parse(el.textContent||'null'); }catch(e){ return 0; }
  if(!seed||!seed.state||!Array.isArray(seed.state.rooms)||!seed.state.rooms.length) return 0;
  const incoming=seed.photos||[];
  let done=0;
  for(const p of incoming){
    try{
      await idbPut('photos',{id:p.id,roomId:p.roomId,ts:p.ts,
        full:await (await fetch(p.full)).blob(), thumb:await (await fetch(p.thumb)).blob()});
      done++;
    }catch(e){}
    if(done%15===0) toast(`Loading photos… ${done}/${incoming.length}`);
  }
  const present=new Set((await idbAll('photos').catch(()=>[])).map(p=>p.id));
  state=seed.state;
  normalizeStandard();
  state.rooms=state.rooms.filter(r=>r&&typeof r==='object').map(r=>{
    normalizeRoom(r); r.photos=r.photos.filter(id=>present.has(id)); return r; });
  state.seedApplied=SEED_ID;
  await supersede();
  deleteIntent=Date.now();
  await writeState();
  await snapshot('recovery load');
  el.textContent='';                      // free the memory once it is on disk
  return state.rooms.length;
}
async function snapshot(reason){
  if(!loadOK || !state.rooms.length) return;
  try{
    const keys=(await idbKeys('kv')).filter(k=>typeof k==='string'&&k.startsWith('snap:')).sort();
    const last=keys[keys.length-1];
    if(last && reason==='auto'){
      const prev=await idbGet('kv',last);
      // skip if nothing meaningful changed since the last snapshot
      if(prev && prev.rooms===state.rooms.length && Date.now()-prev.ts<240000) return;
    }
    /* Two snapshots inside the same millisecond would share a key and the
       second would erase the first. Nudge forward until the key is free. */
    let ts=Date.now(); const taken=new Set(keys);
    while(taken.has('snap:'+ts)) ts++;
    await idbPut('kv',{ts,reason,rooms:state.rooms.length,
      items:state.rooms.reduce((n,r)=>n+r.inventory.length,0),
      photos:state.rooms.reduce((n,r)=>n+r.photos.length,0),
      data:JSON.parse(JSON.stringify(state))},'snap:'+ts);
    const all=(await idbKeys('kv')).filter(k=>typeof k==='string'&&k.startsWith('snap:')).sort();
    while(all.length>SNAP_KEEP) await idbDel('kv',all.shift());
  }catch(e){}
}

const candidates = ()=>state.rooms.filter(r=>r.upgradeTo);

/* Deletions are remembered on this device, not just asked of the server.
   Without this, a delete comes straight back on the next sync whenever the
   server call failed, or another phone still holding the room pushes it up. */
const DELETED_KEEP_DAYS=60;
function normalizeDeleted(){
  if(!state.deleted||typeof state.deleted!=='object'||Array.isArray(state.deleted)) state.deleted={};
  const cut=Date.now()-DELETED_KEEP_DAYS*86400000;
  Object.entries(state.deleted).forEach(([k,v])=>{ if(!Number.isFinite(v)||v<cut) delete state.deleted[k]; });
  return state.deleted;
}
const isDeleted = id => !!normalizeDeleted()[id];
function markDeleted(id){ normalizeDeleted()[id]=Date.now(); }

/* --- room standard: the minimum every room is supposed to have --- */
function normalizeStandard(){
  if(!state.standard||typeof state.standard!=='object') state.standard={all:[],byType:{}};
  if(!Array.isArray(state.standard.all)) state.standard.all=[];
  if(!state.standard.byType||typeof state.standard.byType!=='object') state.standard.byType={};
  state.standard.all=state.standard.all.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim());
  Object.keys(state.standard.byType).forEach(k=>{
    const v=state.standard.byType[k];
    state.standard.byType[k]=Array.isArray(v)?v.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()):[];
  });
}
/* A standard line may carry a required count: "Desk x2", "2x Desk" or "Desk (2)". */
function parseStdLine(line){
  let t=String(line).replace(/\s+/g,' ').trim(), qty=1, m;
  if((m=t.match(/^(\d{1,3})\s*(?:x|×)?\s+(.+)$/i)) && +m[1]>0){ qty=+m[1]; t=m[2]; }
  else if((m=t.match(/^(.+?)\s*(?:x|×)\s*(\d{1,3})$/i)) && +m[2]>0){ t=m[1]; qty=+m[2]; }
  else if((m=t.match(/^(.+?)\s*\(\s*(\d{1,3})\s*\)$/)) && +m[2]>0){ t=m[1]; qty=+m[2]; }
  return {name:t.trim(), qty:Math.min(99,Math.max(1,qty))};
}
const stdLine = o => o.qty>1 ? `${o.name} x${o.qty}` : o.name;
let _reqCache=new Map(), _reqStamp=null;
function stdStamp(){ return JSON.stringify(state.standard); }
function requiredFor(r){
  normalizeStandard();
  const st=stdStamp();
  if(st!==_reqStamp){ _reqCache=new Map(); _reqStamp=st; }
  const key=r.type||'';
  if(_reqCache.has(key)) return _reqCache.get(key);
  const out=[], seen=new Set();
  const add=raw=>{
    const o=parseStdLine(raw), k=nkey(o.name);
    if(!k) return;
    const prev=out.find(x=>nkey(x.name)===k);
    if(prev){ prev.qty=Math.max(prev.qty,o.qty); return; }   // per-type may raise the count
    seen.add(k); out.push(o);
  };
  if(isGuestRoom(r.type)) state.standard.all.forEach(add);
  (state.standard.byType[r.type]||[]).forEach(add);
  _reqCache.set(key,out);
  return out;
}
/* Short if never listed, marked Missing, or fewer than the standard calls for. */
function missingFor(r){
  const out=[];
  requiredFor(r).forEach(req=>{
    const it=r.inventory.find(i=>nkey(i.name)===nkey(req.name));
    const have = (!it || it.condition==='Missing') ? 0 : Math.max(0,+it.qty||0);
    if(have<req.qty) out.push({name:req.name,need:req.qty,have});
  });
  return out;
}
/* Everything outstanding in a room, as symbol + line. One source of truth for

const TODO_LEGEND=[

function roomTodos(r){
  const out=[];
  if(standardIsSet()) missingFor(r).forEach(m=>{
    out.push(m.have>0
      ? {sym:'!',cls:'t-short',kind:'short',text:`${m.name} — only ${m.have} of ${m.need}`,name:m.name,need:m.need}

  if(!r.photos.length) out.push({sym:'◎',cls:'t-photo',kind:'photo',text:'No photos taken yet'});
  if(r.status!=='complete') out.push({sym:'○',cls:'t-open',kind:'status',text:'Room not marked complete'});
  return out;
}
function todoLineHTML(r,t){

}

const missLabel = m => m.need>1 ? `${m.name} — ${m.have} of ${m.need}` : m.name;
/* unchecked | present | short | missing — drives the room panel */
function standardState(r){
  return requiredFor(r).map(req=>{
    const it=r.inventory.find(i=>nkey(i.name)===nkey(req.name));
    if(!it) return {name:req.name,need:req.qty,have:0,state:'unchecked'};

  });
}

    <p class="hint">Need more than one? Put the count after the item — <strong>Desk x2</strong>. Paste your whole list at once. Capitalisation and spacing don't matter, but the wording should match what you call the item in rooms — the ★ chips under Quick add use these exact names, so tapping those always matches.</p>
    ${scope==='__all__'?`<div class="btnrow" style="margin-top:4px"><button class="btn sm" id="stdReset">Restore the original list</button></div>`:(isGuestRoom(scope)
      ? `<p class="hint">These are <strong>extra</strong> items for ${esc(scope)}, on top of the baseline. A count here can raise the baseline count but never lower it.</p>`
      : `<p class="hint"><strong>${esc(scope)} is not a guest room</strong>, so the baseline is skipped entirely. Only what you list here is checked. Leave it empty and these rooms are never flagged.</p>`)}
  `);
  const sel=document.getElementById('stdScope');
  sel.value=scope;
  sel.addEventListener('change',()=>{
    saveStandard(scope,document.getElementById('stdList').value);
    sheetStandard(sel.value);
  });
}
function saveStandard(scope,text){
  normalizeStandard();
  const list=text.split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean).map(parseStdLine);
  const seen=new Set(), clean=[];
  list.forEach(o=>{const k=nkey(o.name); if(k&&!seen.has(k)){seen.add(k);clean.push(stdLine(o))}});
  if(scope==='__all__') state.standard.all=clean; else state.standard.byType[scope]=clean;
  save();
}
/* Backups written by an older build can be missing fields. Anything that
   reads a room assumes these exist, so normalise on the way in. */
function normalizeRoom(r){
  r.id=r.id||uid();
  r.number=String(r.number==null?'':r.number);
  ['type','floor','notes','upgradeTo','upgradeNote'].forEach(k=>{ if(typeof r[k]!=='string') r[k]=''; });
  if(!STATUSES.some(s=>s.k===r.status)) r.status='notdone';
  if(!Array.isArray(r.photos)) r.photos=[];
  if(!Array.isArray(r.inventory)) r.inventory=[]; else r.inventory.forEach(i=>{
    i.id=i.id||uid(); i.name=String(i.name||'Unnamed item');
    i.qty=Number.isFinite(+i.qty)?+i.qty:1;
    if(!CONDITIONS.includes(i.condition)) i.condition='Good';
    if(typeof i.notes!=='string') i.notes=''; if(typeof i.category!=='string') i.category='';
  });
  if(!Array.isArray(r.work)) r.work=[]; else r.work.forEach(w=>{
    w.id=w.id||uid(); w.task=String(w.task||'Untitled job');
    if(!STATUSES.some(s=>s.k===w.status)) w.status='notdone';
    if(typeof w.priority!=='string') w.priority='Normal';
    if(typeof w.notes!=='string') w.notes='';
  });
  if(!Number.isFinite(r.updated)) r.updated=Date.now();
  if(!Number.isFinite(r.savedAt)) r.savedAt=0;
  return r;
}

/* ---------------- photo handling ---------------- */
function fileToImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.decoding='sync';
    img.onload=()=>{URL.revokeObjectURL(url);res(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode failed'))};
    img.src=url;
  });
}
/* Encode a source (ImageBitmap or HTMLImageElement) down to a JPEG blob.
   Steps down in halves first: iOS silently produces blank canvases when
   drawing a very large image straight to a small one. */
function encode(src,max,quality){
  let w=src.width, h=src.height;
  if(!w||!h) return Promise.resolve(null);
  const scale=Math.min(1,max/Math.max(w,h));
  let tw=Math.max(1,Math.round(w*scale)), th=Math.max(1,Math.round(h*scale));
  let canvas=document.createElement('canvas');
  let cur=src, cw=w, ch=h;
  while(cw>tw*2 && ch>th*2){
    const nw=Math.max(tw,Math.round(cw/2)), nh=Math.max(th,Math.round(ch/2));
    const step=document.createElement('canvas');
    step.width=nw; step.height=nh;
    const sctx=step.getContext('2d');
    sctx.imageSmoothingQuality='high';
    sctx.drawImage(cur,0,0,nw,nh);
    cur=step; cw=nw; ch=nh;
  }
  canvas.width=tw; canvas.height=th;
  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(cur,0,0,tw,th);
  return new Promise(res=>{
    try{ canvas.toBlob(b=>res(b&&b.size>0?b:null),'image/jpeg',quality); }
    catch(e){ res(null); }
  });
}
/* Prefer createImageBitmap: it decodes off the canvas path, which avoids the
   iOS pixel ceiling on 48MP photos, and honours EXIF rotation explicitly. */
async function decodeSource(file){
  if(typeof createImageBitmap==='function'){
    try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
    catch(e){ /* fall through — Safari lacks the options arg on older versions */ }
    try{ return await createImageBitmap(file); }
    catch(e){}
  }
  return await fileToImage(file);
}
async function addPhotos(roomId,files){
  const r=room(roomId); if(!r) return;
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  let added=0, skipped=0, quota=false, decodeFail=0;
  for(const f of files){
    if(r.photos.length>=MAX_PHOTOS){skipped++;continue}
    if(f.type && !/^image\//.test(f.type)){skipped++;continue}
    let src=null;
    try{
      src=await decodeSource(f);
      const full=await encode(src,1500,.72);
      const thumb=await encode(src,340,.6);
      if(!full||!thumb){ decodeFail++; skipped++; continue; }
      const id=uid();
      await idbPut('photos',{id,roomId,full,thumb,ts:Date.now()});
      r.photos.push(id); added++;
    }catch(e){
      if(e&&(e.name==='QuotaExceededError'||/quota/i.test(e.message||''))) quota=true;
      else decodeFail++;
      skipped++;
    }finally{
      if(src&&src.close) src.close();
    }
  }
  r.updated=Date.now(); save(); renderRoom();
  if(quota) toast('Storage is full — save a backup, then remove some photos');
  else if(added) toast(`${added} photo${added>1?'s':''} added${skipped?` · ${skipped} skipped`:''}`);
  else if(decodeFail) toast("Couldn't read that photo — try shooting it again");
  else toast(`Limit is ${MAX_PHOTOS} photos per room`);
}
async function thumbURL(id){
  if(thumbURLs.has(id)) return thumbURLs.get(id);
  const p=await idbGet('photos',id); if(!p) return '';
  const u=URL.createObjectURL(p.thumb); thumbURLs.set(id,u); return u;
}
async function removePhoto(roomId,photoId){
  const r=room(roomId); if(!r) return;
  r.photos=r.photos.filter(p=>p!==photoId);
  await idbDel('photos',photoId);
  if(thumbURLs.has(photoId)){URL.revokeObjectURL(thumbURLs.get(photoId));thumbURLs.delete(photoId)}
  r.updated=Date.now(); save(); renderRoom();
}

}

  ];
  document.getElementById('strip').innerHTML = cells.map(x=>
    `<button data-filter="${x.k}" aria-pressed="${filter===x.k}">
       <span class="n">${x.n}</span><span class="l">${x.l}</span>

function visibleRooms(){
  const q=query.trim().toLowerCase();
  return state.rooms.filter(r=>{
    if(filter!=='all' && r.status!==filter) return false;
    if(typeFilter==='__below__'){ if(!missingFor(r).length) return false; }
    else if(typeFilter==='__up__'){ if(!r.upgradeTo) return false; }
    else if(typeFilter==='__none__'){ if(r.type) return false; }
    else if(typeFilter!=='all' && r.type!==typeFilter) return false;
    if(!q) return true;
    const hay=[r.number,r.type,r.floor,r.notes,...r.inventory.map(i=>i.name),...r.work.map(w=>w.task)].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

  filter='all'; typeFilter='all'; query='';

}
function renderTypeFilter(){
  const el=document.getElementById('typeFilter');

  state.rooms.forEach(r=>{const k=r.type||'__none__';counts[k]=(counts[k]||0)+1});

  ROOM_TYPES.forEach(t=>opts.push(`<option value="${esc(t)}">${esc(t)} (${counts[t]||0})</option>`));

  opts.push(`<option value="__none__">Not classified (${counts.__none__||0})</option>`);

  if(standardIsSet()) opts.push(`<option value="__below__">Below standard (${state.rooms.filter(r=>missingFor(r).length).length})</option>`);

        ${!tc.missing&&!tc.short&&!tc.job&&!tc.photo&&!tc.status?`<span class="s" style="background:#eaf5f0;color:#155e46">✓ done</span>`:''}
      </div>

  }).join('');

  const shown=list.length, total=state.rooms.length;
  const fb=document.getElementById('filterBar');
  if(renderPickBar()){ /* selection bar takes priority */ }

    fb.innerHTML=`Showing <strong>${shown}</strong> of <strong>${total}</strong> rooms — a filter is on.
      <button class="btn sm" id="showAll" style="margin-left:8px">Show all ${total}</button>`;
    fb.classList.remove('hidden');

  const days=(Date.now()-(state.lastBackup||0))/86400000;
  const never=!state.lastBackup;

  if(due) warn.innerHTML = never
    ? `<strong>You have unsaved work only on this phone.</strong> Menu → Save backup file writes a copy you can put in Drive. Do it now — it takes ten seconds.`

}

/* Writes, then reads the data back off the disk and checks it matches.
   A save that only claims success is what lost the rooms the first time. */
async function saveRoomNow(){
  const r=room(currentRoomId); if(!r) return;
  const btn=document.getElementById('saveRoom');
  btn.disabled=true; btn.textContent='Saving…';
  try{
    r.savedAt=Date.now();
    clearTimeout(saveTimer);
    await writeState();
    const stored=await idbGet('kv','state');
    const back=stored&&Array.isArray(stored.rooms)?stored.rooms.find(x=>x.id===r.id):null;
    const good = !!back
      && back.inventory.length===r.inventory.length
      && back.work.length===r.work.length
      && back.photos.length===r.photos.length
      && String(back.number)===String(r.number);
    if(good){
      await snapshot('room '+r.number);
      toast(`Room ${r.number} saved · ${r.inventory.length} items, ${r.photos.length} photos`);
      syncNow(true);
    }else{
      r.savedAt=0;
      alert(`Room ${r.number} did NOT save.\n\nIt was written but could not be read back, so do not close the app.\n\nOpen the menu, save a backup file now, then reload the page.`);
    }
  }catch(e){
    r.savedAt=0;

  if(!list.some(r=>r.id===id)) list=state.rooms;
  const i=list.findIndex(r=>r.id===id);
  return {prev:i>0?list[i-1]:null, next:(i>=0&&i<list.length-1)?list[i+1]:null,
          index:i<0?0:i, total:list.length};
}

/* ================= shared sync =================
   The server holds one copy per room. On open we pull anything newer,
   merge it into what is here, then push anything of ours that is newer.
   Everything still works with sync switched off or unreachable. */
const API='/.netlify/functions/sync';
let syncState={on:true,busy:false,last:0,err:'',rooms:0,photos:0};

async function api(action,opts={}){
  const u=`${API}?action=${encodeURIComponent(action)}`+(opts.id?`&id=${encodeURIComponent(opts.id)}`:'');
  const res=await fetch(u,{
    method:opts.body?'POST':(opts.method||'GET'),
    headers:opts.body?{'content-type':'application/json'}:undefined,
    body:opts.body?JSON.stringify(opts.body):undefined
  });
  const data=await res.json().catch(()=>({ok:false,error:'bad response'}));
  return {status:res.status,data};
}

async function pushRoom(r){
  let attempt=0;
  while(attempt++<3){
    const send=JSON.parse(JSON.stringify(r));
    delete send.savedAt;
    const {status,data}=await api('room',{body:{room:send,baseRev:r.rev||0}});
    if(status===200){ r.rev=data.rev; return true; }
    if(status===410 || (data && data.deleted)){
      markDeleted(r.id);
      state.rooms=state.rooms.filter(x=>x.id!==r.id);
      return false;
    }
    if(status===409 && data.room){
      const {room:merged}=mergeRooms(r,normalizeRoom(data.room));   // union, nothing lost
      merged.rev=data.room.rev;
      merged.updated=Math.max(merged.updated||0,(data.room.updated||0)+1);
      const i=state.rooms.findIndex(x=>x.id===r.id);
      if(i>=0) state.rooms[i]=merged;
      r=merged;
      continue;
    }
    return false;
  }
  return false;
}

async function syncNow(quiet){
  if(!syncState.on||syncState.busy) return;
  syncState.busy=true; syncState.err=''; renderSyncChip();
  let pulled=0, pushed=0, upPhotos=0, downPhotos=0;
  /* A room we merged locally now differs from BOTH copies, so it has to go
     back up — otherwise the other phone never sees the combined version. */
  const dirty=new Set();
  try{
    const {status,data}=await api('manifest');
    if(status!==200||!data.ok) throw new Error(data.error||'server not reachable');

    /* Deletions from either side. Ours are retried until the server accepts
       them, so a delete never silently undoes itself. */
    const gone=new Set(data.deleted||[]);
    Object.keys(normalizeDeleted()).forEach(id=>gone.add(id));
    (data.deleted||[]).forEach(id=>markDeleted(id));
    for(const id of Object.keys(state.deleted)){
      if((data.rooms||{})[id]){                          // still on the server — ask again
        try{ await api('room',{id,method:'DELETE'}); }catch(e){}
      }
    }
    if(gone.size){
      const before=state.rooms.length;
      state.rooms=state.rooms.filter(r=>!gone.has(r.id));
      pulled+=before-state.rooms.length;
    }

    /* pull rooms that are new or newer than ours */
    for(const [id,info] of Object.entries(data.rooms||{})){
      const mine=state.rooms.find(x=>x.id===id);
      if(mine && (mine.rev||0)>=(info.rev||0) && (mine.updated||0)>=(info.updated||0)) continue;
      const got=await api('room',{id});
      if(got.status!==200||!got.data.room) continue;
      const theirs=normalizeRoom(got.data.room);
      if(gone.has(id)) continue;
      if(!mine){ state.rooms.push(theirs); pulled++; }
      else{
        const {room:merged}=mergeRooms(mine,theirs);
        merged.rev=theirs.rev||0;
        if(merged.inventory.length!==theirs.inventory.length
          || merged.work.length!==theirs.work.length
          || merged.photos.length!==theirs.photos.length
          || (merged.notes||'')!==(theirs.notes||'')) dirty.add(merged.id);
        state.rooms[state.rooms.indexOf(mine)]=merged;
        pulled++;
      }
    }

    /* push ours that the server has not got, or that we changed since */
    for(const r of state.rooms){
      if(gone.has(r.id)) continue;
      const info=(data.rooms||{})[r.id];
      if(!dirty.has(r.id) && info
         && (info.updated||0)>=(r.updated||0) && (info.rev||0)>=(r.rev||0)) continue;
      if(await pushRoom(r)) pushed++;
    }

    /* photos: upload ours, fetch theirs */
    const there=new Set(data.photos||[]);
    const localPhotos=await idbAll('photos').catch(()=>[]);
    const localIds=new Set(localPhotos.map(p=>p.id));
    for(const p of localPhotos){
      if(there.has(p.id)) continue;
      try{
        await api('photo',{body:{id:p.id,roomId:p.roomId,ts:p.ts,
          full:await blobToDataURL(p.full), thumb:await blobToDataURL(p.thumb)}});
        upPhotos++;
      }catch(e){}
      if(upPhotos%10===0&&upPhotos) toast(`Uploading photos… ${upPhotos}`);
    }
    const wanted=new Set(state.rooms.flatMap(r=>r.photos));
    for(const id of wanted){
      if(localIds.has(id)||!there.has(id)) continue;
      const got=await api('photo',{id});
      if(got.status!==200||!got.data.photo) continue;
      const p=got.data.photo;
      try{
        await idbPut('photos',{id:p.id,roomId:p.roomId,ts:p.ts,
          full:await (await fetch(p.full)).blob(), thumb:await (await fetch(p.thumb||p.full)).blob()});
        downPhotos++;
      }catch(e){}
      if(downPhotos%10===0) toast(`Downloading photos… ${downPhotos}`);
    }

    /* the room standard travels with the survey */
    normalizeStandard();
    const localMeta={property:state.property,standard:state.standard,updated:state.standardUpdated||0};
    if(data.meta && (data.meta.updated||0)>(localMeta.updated||0)){
      state.standard=data.meta.standard||state.standard;
      state.property=data.meta.property||state.property;
      state.standardUpdated=data.meta.updated||0;
      normalizeStandard();
    } else if(!data.meta || (localMeta.updated||0)>(data.meta.updated||0)){
      await api('meta',{body:localMeta});
    }

    state.rooms.sort((a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true}));
    const present=new Set((await idbAll('photos')).map(p=>p.id));
    state.rooms.forEach(r=>{ r.photos=r.photos.filter(id=>present.has(id)); });
    await supersede(); deleteIntent=Date.now(); await writeState();
    syncState.last=Date.now(); syncState.rooms=state.rooms.length;
    if(!quiet) toast(`Synced · ${pulled} in, ${pushed} out${upPhotos||downPhotos?` · ${upPhotos}↑ ${downPhotos}↓ photos`:''}`);
    refresh();
  }catch(e){
    syncState.err=String(e&&e.message||e);
    if(!quiet) toast('Sync failed — working offline. '+syncState.err);
  }
  syncState.busy=false; renderSyncChip();
}

function renderSyncChip(){
  const el=document.getElementById('syncBtn');
  if(!el) return;
  el.textContent = syncState.busy ? 'Syncing…'
    : syncState.err ? 'Offline'
    : syncState.last ? 'Synced' : 'Sync';
  el.style.opacity = syncState.busy ? '.6' : '1';
}

async function deleteRooms(ids){
  const list=ids.map(id=>room(id)).filter(Boolean);
  if(!list.length) return;
  const photos=list.reduce((n,r)=>n+r.photos.length,0);
  const work=list.reduce((n,r)=>n+r.inventory.length,0);
  const names=list.map(r=>r.number).join(', ');
  if(!confirm(`Delete ${list.length===1?'room '+names:list.length+' rooms ('+names+')'}?`
    +(work||photos?`\n\nThis removes ${work} items and ${photos} photos.`:'')
    +`\n\nIt is removed from every phone once they sync. Menu → Recover can undo it.`)) return;

  deleteIntent=Date.now();
  await snapshot('before delete');
  for(const r of list){
    for(const pid of r.photos){
      await idbDel('photos',pid).catch(()=>{});
      if(thumbURLs.has(pid)){ URL.revokeObjectURL(thumbURLs.get(pid)); thumbURLs.delete(pid); }
    }
    markDeleted(r.id);                                   // remembered here first
    try{ await api('room',{id:r.id,method:'DELETE'}); }catch(e){}   // then asked of the server
    state.rooms=state.rooms.filter(x=>x.id!==r.id);
  }
  picked.clear(); pickMode=false;
  await writeState();
  clearFilters(); showBoard();
  toast(`${list.length} room${list.length===1?'':'s'} deleted`);
}

function parseRooms(str){
  const out=[];
  str.split(',').map(s=>s.trim()).filter(Boolean).forEach(part=>{
    const m=part.match(/^(\d+)\s*[-–]\s*(\d+)$/);
    if(m){
      let a=parseInt(m[1],10),b=parseInt(m[2],10);
      if(a>b)[a,b]=[b,a];
      if(b-a>400)b=a+400;
      for(let i=a;i<=b;i++) out.push(String(i));
    } else out.push(part);
  });
  return out;
}
function addRooms(str,type){
  const names=parseRooms(str);
  const have=new Set(state.rooms.map(r=>nkey(r.number)));
  let n=0;
  names.forEach(name=>{
    if(have.has(nkey(name))) return;
    have.add(nkey(name));
    state.rooms.push({id:uid(),number:name,type:type||'',floor:'',status:'notdone',notes:'',upgradeTo:'',upgradeNote:'',inventory:[],work:[],photos:[],updated:Date.now()});
    n++;
  });
  state.rooms.sort((a,b)=>a.number.localeCompare(b.number,undefined,{numeric:true}));
  save(); renderBoard();
  toast(n?`${n} room${n>1?'s':''} added`:'Those rooms already exist');
}

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error('offline'));
    document.head.appendChild(s);
  });
}
function download(blob,name){
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
}

/* Combine two versions of the same room. Nothing is ever dropped: lists are
   unioned, and where both sides describe the same item the richer entry wins. */
const richerItem=(a,b)=>{
  const score=x=>((x.notes&&x.notes.trim())?4:0)+(x.condition&&x.condition!=='Good'?2:0)+(+x.qty>1?1:0);
  return score(b)>score(a)?b:a;
};
const richerJob=(a,b)=>{
  const score=x=>((x.notes&&x.notes.trim())?4:0)+(x.status&&x.status!=='notdone'?2:0)+(x.priority&&x.priority!=='Normal'?1:0);
  return score(b)>score(a)?b:a;
};
function mergeRooms(cur,inc){
  const out=normalizeRoom(JSON.parse(JSON.stringify(cur)));
  const gains={items:0,jobs:0,photos:0};

  const byItem=new Map(out.inventory.map(i=>[nkey(i.name),i]));
  (inc.inventory||[]).forEach(i=>{
    const k=nkey(i.name);
    if(!byItem.has(k)){ out.inventory.push(i); byItem.set(k,i); gains.items++; }
    else{
      const win=richerItem(byItem.get(k),i);
      const idx=out.inventory.indexOf(byItem.get(k));
      if(win!==byItem.get(k)){ out.inventory[idx]={...win,id:byItem.get(k).id}; byItem.set(k,out.inventory[idx]); }
    }
  });

  const byJob=new Map(out.work.map(w=>[nkey(w.task),w]));
  (inc.work||[]).forEach(w=>{
    const k=nkey(w.task);
    if(!byJob.has(k)){ out.work.push(w); byJob.set(k,w); gains.jobs++; }
    else{
      const win=richerJob(byJob.get(k),w);
      const idx=out.work.indexOf(byJob.get(k));
      if(win!==byJob.get(k)){ out.work[idx]={...win,id:byJob.get(k).id}; byJob.set(k,out.work[idx]); }
    }
  });

  const seen=new Set(out.photos);
  (inc.photos||[]).forEach(p=>{ if(!seen.has(p)){ out.photos.push(p); seen.add(p); gains.photos++; } });

  ['type','floor','upgradeTo'].forEach(f=>{ if(!out[f] && inc[f]) out[f]=inc[f]; });
  [['notes','notes'],['upgradeNote','upgradeNote']].forEach(([f])=>{
    const a=(out[f]||'').trim(), b=(inc[f]||'').trim();
    if(!a && b) out[f]=b;
    else if(a && b && nkey(a)!==nkey(b)) out[f]=a+'\n'+b;      // keep both notes
  });
  if(out.status==='notdone' && inc.status && inc.status!=='notdone') out.status=inc.status;
  out.updated=Math.max(out.updated||0, inc.updated||0);
  out.savedAt=0;
  return {room:out,gains};
}

function buildMergePlan(data){
  const incoming=data.state.rooms.filter(r=>r&&typeof r==='object').map(normalizeRoom);
  const add=[], merge=[];
  incoming.forEach(inc=>{
    const cur=state.rooms.find(x=>nkey(x.number)===nkey(inc.number));
    if(!cur){ add.push(inc); return; }
    const {room,gains}=mergeRooms(cur,inc);
    merge.push({cur,inc,room,gains});
  });
  return {add,merge,incoming};
}

function mergeBackup(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';

    const f=inp.files[0]; if(!f) return;

    const tot=changed.reduce((a,m)=>({i:a.i+m.gains.items,j:a.j+m.gains.jobs,p:a.p+m.gains.photos}),{i:0,j:0,p:0});

      <div class="card"><div class="body">
