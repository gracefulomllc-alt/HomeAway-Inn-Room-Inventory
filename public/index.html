        </div>
      </div></div>
      ${plan.add.length?`<p class="hint" style="margin:0 0 4px"><strong>New rooms</strong></p>
        <p class="hint" style="margin:0 0 12px">${plan.add.map(r=>esc(r.number)).join(', ')}</p>`:''}
      ${changed.length?`<p class="hint" style="margin:0 0 4px"><strong>Rooms gaining detail</strong></p>
        ${changed.map(m=>`<div class="stdrow"><span class="nm">Room ${esc(m.cur.number)}
          <span class="tag t-unchecked">+${m.gains.items} items · +${m.gains.jobs} jobs · +${m.gains.photos} photos</span></span></div>`).join('')}
        <div style="height:10px"></div>`:''}
      <div class="btnrow">
        <button class="btn primary" id="doMerge">Merge into this device</button>
        <button class="btn" data-close>Cancel</button>
      </div>
    `);
    pendingMerge={data,plan};
  };
  inp.click();
}
let pendingMerge=null;

async function applyMerge(){
  if(!pendingMerge) return;
  const {data,plan}=pendingMerge;
  await snapshot('before merge');
  const incomingPhotos=data.photos||[];
  let n=0;
  for(const p of incomingPhotos){
    if(!p||!p.id||!p.full) continue;
    try{
      if(!(await idbGet('photos',p.id))){
        await idbPut('photos',{id:p.id,roomId:p.roomId,ts:p.ts,
          full:await (await fetch(p.full)).blob(), thumb:await (await fetch(p.thumb||p.full)).blob()});
      }
    }catch(e){}
    if(++n%15===0) toast(`Merging photos… ${n}/${incomingPhotos.length}`);
  }
  const present=new Set((await idbAll('photos')).map(p=>p.id));

  plan.merge.forEach(m=>{
    const i=state.rooms.findIndex(x=>x.id===m.cur.id);
    m.room.photos=m.room.photos.filter(id=>present.has(id));
    if(i>=0) state.rooms[i]=m.room;
  });
  plan.add.forEach(inc=>{
    inc.photos=inc.photos.filter(id=>present.has(id));
    inc.savedAt=0;
    state.rooms.push(inc);
  });
  state.rooms.forEach(r=>{ r.photos=r.photos.filter(id=>present.has(id)); });

  normalizeStandard();
  const incStd=(data.state.standard&&Array.isArray(data.state.standard.all))?data.state.standard.all:[];
  if(incStd.length>state.standard.all.length) state.standard.all=incStd;
  if(data.state.standard&&data.state.standard.byType){
    Object.entries(data.state.standard.byType).forEach(([k,v])=>{
      if(Array.isArray(v)&&v.length>(state.standard.byType[k]||[]).length) state.standard.byType[k]=v;
    });
  }

  state.rooms.sort((a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true}));
  await supersede();
  deleteIntent=Date.now();
  await writeState();
  await snapshot('after merge');
  pendingMerge=null;
  closeSheet(); clearFilters(); showBoard();
  toast(`Merged · ${state.rooms.length} rooms total`);
}

let pendingRestore=null;
function importBackup(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    let data;
    try{ data=JSON.parse(await f.text()); }
    catch(e){ toast('That file is too large or damaged to read'); return; }
    if(!data.state||!Array.isArray(data.state.rooms)){ toast('That is not a survey backup'); return; }

    const rooms=data.state.rooms.filter(r=>r&&typeof r==='object');
    const photos=(data.photos||[]).length;
    const onDevice=(await idbAll('photos').catch(()=>[])).length;
    const items=rooms.reduce((n,r)=>n+((r.inventory||[]).length),0);
    const worked=rooms.filter(r=>(r.inventory||[]).length||(r.photos||[]).length).length;

    pendingRestore=data;
    openSheet(`
      <h3>Check this file first</h3>
      <p class="hint" style="margin-bottom:10px;word-break:break-all"><strong>${esc(f.name)}</strong> · ${(f.size/1048576).toFixed(2)} MB</p>
      <div class="card"><div class="body">
        <div style="font-family:var(--mono);font-size:13px;line-height:1.8">
          <strong style="font-size:22px">${rooms.length}</strong> rooms in this file<br>
          ${worked} with work recorded · ${items} items<br>
          ${photos} photos in the file · ${onDevice} already on this phone
        </div>
      </div></div>
      <p class="hint" style="margin:0 0 4px"><strong>Rooms it contains</strong></p>
      <p class="hint" style="margin:0 0 14px;word-break:break-word">${rooms.map(r=>esc(String(r.number))).join(', ')}</p>
      <div class="warnbar" style="background:#fbeee9;border-color:#e6b8a8;color:#7c2d12">
        This <strong>replaces</strong> the ${state.rooms.length} rooms currently on this phone.
        If you want both sets, cancel and use <strong>Merge</strong> instead.
      </div>
      <div class="btnrow">
        <button class="btn primary" id="doRestore">Load these ${rooms.length} rooms</button>
        <button class="btn" data-close>Cancel</button>
      </div>
    `);
  };
  inp.click();
}

async function applyRestore(){
  const data=pendingRestore; if(!data) return;
  deleteIntent=Date.now(); await snapshot('before restore');
  try{
    const incoming=data.photos||[];
    for(const [,u] of thumbURLs) URL.revokeObjectURL(u);
    thumbURLs.clear();
    let done=0;
    for(const p of incoming){
      try{
        await idbPut('photos',{id:p.id,roomId:p.roomId,ts:p.ts,
          full:await (await fetch(p.full)).blob(), thumb:await (await fetch(p.thumb||p.full)).blob()});
      }catch(e){}
      if(++done%20===0) toast(`Loading photos… ${done}/${incoming.length}`);
    }
    state=data.state;
    if(typeof state.property!=='string'||!state.property) state.property='Home Away Inn';
    normalizeStandard();
    const present=new Set((await idbAll('photos')).map(p=>p.id));
    let kept=0, dropped=0;
    state.rooms=state.rooms.filter(r=>r&&typeof r==='object').map(r=>{
      normalizeRoom(r);
      const b=r.photos.length;
      r.photos=r.photos.filter(pid=>present.has(pid));
      kept+=r.photos.length; dropped+=b-r.photos.length;
      return r;
    });
    await supersede();
    deleteIntent=Date.now();
    await writeState();

    const check=await idbGet('kv','state');
    const landed=check&&Array.isArray(check.rooms)?check.rooms.length:0;
    await snapshot('after restore');
    const want=state.rooms.length;
    pendingRestore=null;
    closeSheet(); clearFilters(); showBoard();
    if(landed!==want){
      alert(`Only ${landed} of ${want} rooms reached storage.\n\nDo not close the app — save a backup file from the menu now.`);
    } else {
      alert(`Loaded ${landed} rooms and ${kept} photos.${dropped?`\n\n${dropped} photos belonging to these rooms are not on this phone.`:''}`);
    }
  }catch(e){
    pendingRestore=null;
    alert('The restore did not finish. Nothing was lost — try again, or use the smaller file.');
  }
}

/* ---------------- events ---------------- */
document.addEventListener('click', async e=>{
  const t=e.target.closest('button, img[data-view]');
  if(!t) return;

  if(t.hasAttribute('data-close')) return closeSheet();

  /* board */
  const f=t.closest('[data-filter]');
  if(f){ filter=f.dataset.filter; renderBoard(); return; }
  const tile=t.closest('[data-room]');
  if(tile){
    if(suppressTileClick){ suppressTileClick=false; return; }
    if(pickMode){ togglePick(tile.dataset.room); return; }
    return showRoom(tile.dataset.room);
  }

  const id=t.id;
  if(id==='showAll'){ clearFilters(); renderBoard(); return; }
  if(id==='cancelPick'){ pickMode=false; picked.clear(); renderBoard(); return; }
  if(id==='killPicked'){
    if(!picked.size){ toast('Tap the rooms you want to remove first'); return; }
    return deleteRooms([...picked]);
  }
  const op=t.closest('[data-openroom]');
  if(op){ closeSheet(); return showRoom(op.dataset.openroom); }
  const pm=t.closest('[data-pickmode]');
  if(pm){ closeSheet(); pickMode=true; picked.clear(); clearFilters(); showBoard(); toast('Tap rooms to select them'); return; }
  const kr=t.closest('[data-killroom]');
  if(kr){ closeSheet(); return deleteRooms([kr.dataset.killroom]); }
  const qc=t.closest('[data-quickcomplete]');
  if(qc){
    const rr=room(qc.dataset.quickcomplete);
    if(rr){ rr.status='complete'; rr.updated=Date.now(); save(); toast(`Room ${rr.number} marked complete`); }
    closeSheet(); renderBoard(); return;
  }
  if(id==='syncBtn') return syncNow(false);
  if(id==='todoBtn') return showTodo();
  if(id==='fab') return sheetAddRooms();
  if(id==='backBtn'){ flushSave(); return showBoard(); }
  if(id==='saveRoom') return saveRoomNow();
  if(id==='menuBtn') return sheetMenu();
  if(id==='lbClose'){
    const im=document.getElementById('lbImg');
    if(im.src.startsWith('blob:')) URL.revokeObjectURL(im.src);
    im.removeAttribute('src');
    return document.getElementById('lightbox').classList.remove('on');
  }

  if(id==='doAddRooms'){
    const v=document.getElementById('roomInput').value;
    if(!v.trim()) return toast('Enter at least one room number');
    addRooms(v,document.getElementById('typeInput').value.trim());
    closeSheet(); return;
  }

  /* menu actions */
  if(id==='expXlsx'){closeSheet();return exportXlsx()}
  if(id==='expReport'){return sheetReport()}
  if(id==='doReport'){
    const sc=document.getElementById('repScope').value;
    const ph=document.getElementById('repPhotos').value;
    const nb=document.getElementById('repBreak').value==='1';
    closeSheet(); return exportReport(sc,ph,nb);
  }
  if(id==='doPrint'){ window.print(); return; }
  if(id==='closeReport'){ clearReport(); return; }
  if(id==='expPhotos'){closeSheet();return exportPhotos()}
  if(id==='expBackup'){return sheetBackup()}
  if(id==='bkFull'){closeSheet();return exportBackup(true)}
  if(id==='bkData'){closeSheet();return exportBackup(false)}
  if(id==='impBackup'){return importBackup()}
  if(id==='doRestore'){return applyRestore()}
  if(id==='mergeBackup'){return mergeBackup()}
  if(id==='doMerge'){return applyMerge()}
  if(id==='recover'){ return sheetRecover(); }
  const rs2=t.closest('[data-restoresnap]');
  if(rs2){
    const key=rs2.dataset.restoresnap;
    const snap=await idbGet('kv',key);
    if(!snap||!snap.data){ toast('That snapshot could not be read'); return; }
    if(!confirm(`Go back to the version from ${new Date(snap.ts).toLocaleString()} with ${snap.rooms} rooms? Anything added since is replaced.`)) return;
    deleteIntent=Date.now(); await snapshot('before recover');
    state=snap.data; normalizeStandard();
    state.rooms=state.rooms.filter(x=>x&&typeof x==='object').map(normalizeRoom);
    for(const [,u] of thumbURLs) URL.revokeObjectURL(u);
    thumbURLs.clear();
    await supersede();
    deleteIntent=Date.now();
    await writeState();
    closeSheet(); clearFilters(); showBoard();
    toast(`Restored ${state.rooms.length} rooms`);
    return;
  }
  if(id==='storageInfo'){
    if(navigator.storage&&navigator.storage.estimate){
      const est=await navigator.storage.estimate();
      const used=(est.usage/1048576).toFixed(1), qta=(est.quota/1048576).toFixed(0);
      let persisted=false;
      try{ persisted=await navigator.storage.persisted(); }catch(e){}
      if(!persisted && navigator.storage.persist){ try{ persisted=await navigator.storage.persist(); }catch(e){} }
      alert(`${location.protocol==='file:'?'WARNING: running from a downloaded file. Each copy in Downloads has its own separate storage.\n\n':''}Using ${used} MB of about ${qta} MB available.\n\nProtected from automatic cleanup: ${persisted?'yes':'no'}.\n\nThis copy stores its data under:\n${location.origin}${location.pathname}\n\nOpen the app from a different address and it will look empty — the data is still under the old one. Always use the same bookmark.`);
    } else alert('This browser cannot report storage usage.');
    return;
  }
  if(id==='roomStandard'){ return sheetStandard('__all__'); }
  if(id==='stdReset'){
    const box=document.getElementById('stdList');
    if(!box) return;
    if(!confirm('Put the original baseline list back in the box? Nothing is saved until you tap Save standard.')) return;
    box.value=DEFAULT_STANDARD.join('\n');
    toast('Original list loaded — tap Save standard to keep it');
    return;
  }
  if(id==='setProp'){
    const n=prompt('Property name',state.property);
    if(n&&n.trim()){state.property=n.trim();save();closeSheet();showBoard();}
    return;
  }

  /* room-level — a to-do line names its own room, so it can be acted on
     straight from the combined list without opening the room first */
  const troom=t.closest('[data-troom]');
  if(troom && room(troom.dataset.troom)) currentRoomId=troom.dataset.troom;
  const r=room(currentRoomId);
  if(!r) return;

  const rs=t.closest('[data-roomstatus]');
  if(rs){ r.status=rs.dataset.roomstatus; r.updated=Date.now(); save(); refresh(); return; }

  if(id==='camBtn'||id==='libBtn'){
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.multiple=(id==='libBtn');
    if(id==='camBtn') inp.setAttribute('capture','environment');
    inp.onchange=()=>inp.files.length&&addPhotos(r.id,[...inp.files]);
    inp.click(); return;
  }
  const del=t.closest('[data-delphoto]');
  if(del) return removePhoto(r.id,del.dataset.delphoto);
  const view=t.closest('[data-view]');
  if(view){
    const p=await idbGet('photos',view.dataset.view);
    if(p){ document.getElementById('lbImg').src=URL.createObjectURL(p.full); document.getElementById('lightbox').classList.add('on'); }
    return;
  }

  if(id==='quickAdd') return sheetQuickAdd();
  if(id==='customItem') return sheetItem(null);
  if(id==='quickWork') return sheetQuickWork();
  if(id==='customWork') return sheetWork(null);
  if(id==='copyRoom') return sheetCopyRoom();
  if(id==='doCopy'){
    const src=room(document.getElementById('copyFrom').value);
    if(src){
      const have=new Set(r.inventory.map(i=>nkey(i.name)));
      let n=0;
      src.inventory.forEach(i=>{ if(have.has(nkey(i.name)))return;
        r.inventory.push({...i,id:uid(),notes:''}); n++; });
      r.updated=Date.now(); save(); closeSheet(); renderRoom();
      toast(`${n} item${n===1?'':'s'} copied`);
    }
    return;
  }
  if(id==='delRoom'){
    if(!confirm(`Delete room ${r.number} and its photos? This can't be undone.`)) return;
    deleteIntent=Date.now(); await snapshot('before delete');
    for(const pid of r.photos){
      await idbDel('photos',pid);
      if(thumbURLs.has(pid)){URL.revokeObjectURL(thumbURLs.get(pid));thumbURLs.delete(pid)}
    }
    state.rooms=state.rooms.filter(x=>x.id!==r.id);
    save(); showBoard(); toast('Room deleted'); return;
  }

  const q=t.closest('[data-quick]');
  if(q){
    const name=q.dataset.quick, key=nkey(name);
    const found=r.inventory.find(i=>nkey(i.name)===key);
    if(found){
      const edited = (found.notes&&found.notes.trim()) || +found.qty!==1 || found.condition!=='Good';
      if(edited && !confirm(`"${found.name}" has details filled in (qty ${found.qty}, ${found.condition}${found.notes?', notes':''}). Remove it anyway?`)) return;
      r.inventory=r.inventory.filter(i=>i!==found);
      q.classList.remove('on');
    } else {
      r.inventory.push({id:uid(),name,category:q.dataset.cat==='Your room standard'?'':q.dataset.cat,qty:1,condition:'Good',notes:''});
      q.classList.add('on');
    }
    r.updated=Date.now(); save(); refresh(); return;
  }
  const qw=t.closest('[data-quickwork]');
  if(qw){
    const task=qw.dataset.quickwork, key=nkey(task);
    const found=r.work.find(w=>nkey(w.task)===key);
    if(found){
      const edited=(found.notes&&found.notes.trim())||found.status!=='notdone'||found.priority!=='Normal';
      if(edited && !confirm(`"${found.task}" has been updated (${statusLabel(found.status)}). Remove it anyway?`)) return;
      r.work=r.work.filter(w=>w!==found);
      qw.classList.remove('on');
    } else {
      r.work.push({id:uid(),task,priority:'Normal',status:'notdone',notes:''});
      qw.classList.add('on');
    }
    r.updated=Date.now(); save(); refresh(); return;
  }
  const sp=t.closest('[data-stdpresent]'), sm=t.closest('[data-stdmissing]');
  if(sp||sm){
    const name=(sp||sm).dataset[sp?'stdpresent':'stdmissing'];
    const k=nkey(name);
    let it=r.inventory.find(i=>nkey(i.name)===k);
    if(!it){ it={id:uid(),name,category:'',qty:1,condition:'Good',notes:''}; r.inventory.push(it); }
    if(sp){
      const need=Math.max(1,+sp.dataset.stdqty||1);
      it.qty=Math.max(need,+it.qty||0);
      if(it.condition==='Missing') it.condition='Good';
      toast(`${name} marked as here`);
    } else {
      it.qty=0; it.condition='Missing';
      toast(`${name} marked missing`);
    }
    r.updated=Date.now(); save(); refresh(); return;
  }
  if(id==='allPresent'){
    let n=0;
    standardState(r).forEach(x=>{
      if(x.state!=='unchecked') return;
      r.inventory.push({id:uid(),name:x.name,category:'',qty:x.need,condition:'Good',notes:''});
      n++;
    });
    r.updated=Date.now(); save(); refresh();
    toast(n?`${n} item${n===1?'':'s'} marked present`:'Nothing left to check');
    return;
  }
  if(id==='resetChecks'){
    const names=new Set(requiredFor(r).map(x=>nkey(x.name)));
    const touched=r.inventory.filter(i=>names.has(nkey(i.name)));
    if(!touched.length){ toast('Nothing to clear'); return; }
    if(!confirm(`Clear the ${touched.length} standard checks in room ${r.number}? Items you added yourself and any notes on them are removed too.`)) return;
    r.inventory=r.inventory.filter(i=>!names.has(nkey(i.name)));
    r.updated=Date.now(); save(); refresh(); toast('Checks cleared');
    return;
  }
  const gr=t.closest('[data-gotoroom]');
  if(gr){ flushSave(); return showRoom(gr.dataset.gotoroom); }

  const qu=t.closest('[data-qtyup]'), qd=t.closest('[data-qtydown]');
  if(qu||qd){
    const it=r.inventory.find(x=>x.id===(qu||qd).dataset[qu?'qtyup':'qtydown']);
    if(it){
      it.qty=Math.max(0,Math.min(99,(+it.qty||0)+(qu?1:-1)));
      if(it.qty===0) it.condition='Missing';
      else if(it.condition==='Missing') it.condition='Good';
      r.updated=Date.now(); save(); refresh();
    }
    return;
  }
  const cd=t.closest('[data-cond]');
  if(cd){
    const it=r.inventory.find(x=>x.id===cd.dataset.cond);
    if(it){
      const i2=CONDITIONS.indexOf(it.condition);
      it.condition=CONDITIONS[(i2<0?0:i2+1)%CONDITIONS.length];
      if(it.condition==='Missing') it.qty=0;
      else if(+it.qty===0) it.qty=1;
      r.updated=Date.now(); save(); refresh();
    }
    return;
  }
  const mv=t.closest('[data-moveitem]'), mj=t.closest('[data-movejob]');
  if(mv||mj){
    const sel=document.getElementById('moveTarget');
    const target=sel&&room(sel.value);
    if(!target){ toast('Pick a room to move it to'); return; }
    if(mv){
      const it=r.inventory.find(x=>x.id===mv.dataset.moveitem);
      if(it){
        r.inventory=r.inventory.filter(x=>x!==it);
        const clash=target.inventory.find(x=>nkey(x.name)===nkey(it.name));
        if(clash) Object.assign(clash,{qty:it.qty,condition:it.condition,notes:it.notes||clash.notes});
        else target.inventory.push({...it,id:uid()});
        toast(`${it.name} moved to room ${target.number}`);
      }
    } else {
      const w=r.work.find(x=>x.id===mj.dataset.movejob);
      if(w){
        r.work=r.work.filter(x=>x!==w);
        if(!target.work.some(x=>nkey(x.task)===nkey(w.task))) target.work.push({...w,id:uid()});
        toast(`${w.task} moved to room ${target.number}`);
      }
    }
    r.updated=Date.now(); target.updated=Date.now();
    save(); closeSheet(); refresh();
    return;
  }
  const wd=t.closest('[data-workdone]');
  if(wd){
    const w=r.work.find(x=>x.id===wd.dataset.workdone);
    if(w){ w.status='complete'; r.updated=Date.now(); save(); toast(`${w.task} — done`); refresh(); }
    return;
  }
  const md=t.closest('[data-markdone]');
  if(md){ r.status='complete'; r.updated=Date.now(); save(); toast(`Room ${r.number} marked complete`); refresh(); return; }
  const ah=t.closest('[data-addhere]'); if(ah) return sheetItem(null);
  const aj=t.closest('[data-addjob]');  if(aj) return sheetWork(null);
  const ei=t.closest('[data-edititem]'); if(ei) return sheetItem(ei.dataset.edititem);
  const ew=t.closest('[data-editwork]'); if(ew) return sheetWork(ew.dataset.editwork);

  const ws=t.closest('[data-workstatus]');
  if(ws){
    const w=r.work.find(x=>x.id===ws.dataset.workstatus);
    if(w){ w.status=nextStatus(w.status); r.updated=Date.now(); save(); refresh(); }
    return;
  }

  const ss=t.closest('[data-savestd]');
  if(ss){
    saveStandard(ss.dataset.savestd,document.getElementById('stdList').value);
    state.standardUpdated=Date.now();
    closeSheet();
    if(currentRoomId) renderRoom(); else renderBoard();
    toast('Room standard saved'); return;
  }
  const si=t.closest('[data-saveitem]');
  if(si){
    const name=document.getElementById('iName').value.replace(/\s+/g,' ').trim();
    if(!name) return toast('Give the item a name');
    const payload={name,qty:Math.max(0,parseInt(document.getElementById('iQty').value||'1',10)),
      condition:document.getElementById('iCond').value, notes:document.getElementById('iNotes').value.trim()};
    const existing=si.dataset.saveitem?r.inventory.find(x=>x.id===si.dataset.saveitem):null;
    if(existing) Object.assign(existing,payload);
    else r.inventory.push({id:uid(),category:'',...payload});
    r.updated=Date.now(); save(); closeSheet(); refresh(); return;
  }
  const di=t.closest('[data-delitem]');
  if(di){ r.inventory=r.inventory.filter(x=>x.id!==di.dataset.delitem); r.updated=Date.now(); save(); closeSheet(); refresh(); return; }

  const sw=t.closest('[data-savework]');
  if(sw){
    const task=document.getElementById('wTask').value.replace(/\s+/g,' ').trim();
    if(!task) return toast('Describe what needs doing');
    const payload={task,priority:document.getElementById('wPri').value,
      status:document.getElementById('wStat').value, notes:document.getElementById('wNotes').value.trim()};
    const existing=sw.dataset.savework?r.work.find(x=>x.id===sw.dataset.savework):null;
    if(existing) Object.assign(existing,payload);
    else r.work.push({id:uid(),...payload});
    r.updated=Date.now(); save(); closeSheet(); refresh(); return;
  }
  const dw=t.closest('[data-delwork]');
  if(dw){ r.work=r.work.filter(x=>x.id!==dw.dataset.delwork); r.updated=Date.now(); save(); closeSheet(); refresh(); return; }
});

/* Press and hold a tile for its shortcut menu. Cancels on scroll so a
   flick down the board never opens it. */
let pressTimer=null, pressEl=null, suppressTileClick=false;
function startPress(el){
  if(!el) return;
  pressEl=el; el.classList.add('pressing');
  pressTimer=setTimeout(()=>{
    pressTimer=null;
    el.classList.remove('pressing');
    suppressTileClick=true;
    if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
    sheetRoomActions(el.dataset.room);
  },500);
}
function cancelPress(){
  if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
  if(pressEl){ pressEl.classList.remove('pressing'); pressEl=null; }
}
document.addEventListener('touchstart',e=>{
  const t=e.target.closest('.tile[data-room]');
  if(t) startPress(t);
},{passive:true});
document.addEventListener('touchmove',cancelPress,{passive:true});
document.addEventListener('touchend',cancelPress,{passive:true});
document.addEventListener('touchcancel',cancelPress,{passive:true});
document.addEventListener('mousedown',e=>{
  const t=e.target.closest('.tile[data-room]');
  if(t && e.button===0) startPress(t);
});
document.addEventListener('mouseup',cancelPress);
document.addEventListener('mouseleave',cancelPress);
document.addEventListener('contextmenu',e=>{
  const t=e.target.closest('.tile[data-room]');
  if(!t) return;
  e.preventDefault(); cancelPress();
  sheetRoomActions(t.dataset.room);
});

document.getElementById('scrim').addEventListener('click',closeSheet);
document.getElementById('lightbox').addEventListener('click',e=>{
  if(e.target.closest('#lbClose')) return;
  const im=document.getElementById('lbImg');
  if(im.src.startsWith('blob:')) URL.revokeObjectURL(im.src);
  im.removeAttribute('src');
  document.getElementById('lightbox').classList.remove('on');
});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;renderBoard()});
document.getElementById('typeFilter').addEventListener('change',e=>{typeFilter=e.target.value;renderBoard()});

document.addEventListener('input',e=>{
  const r=room(currentRoomId); if(!r) return;
  if(e.target.id==='rNumber'){
    r.number=e.target.value; r.updated=Date.now(); save();
    document.getElementById('title').innerHTML=`Room ${esc(r.number)}<span class="sub">${esc(r.type||'Not classified')}</span>`;
    return;
  }
  if(e.target.id==='rType'){
    r.type=e.target.value; r.updated=Date.now(); save();
    document.getElementById('title').innerHTML=`Room ${esc(r.number)}<span class="sub">${esc(r.type||'Not classified')}</span>`;
    return;
  }
  if(e.target.id==='rUpgrade'){
    r.upgradeTo=e.target.value; r.updated=Date.now(); save();
    setTimeout(renderRoom,0);   // let the picker finish closing before re-rendering
    return;
  }
  if(e.target.id==='rUpNote'){r.upgradeNote=e.target.value;r.updated=Date.now();save()}
  if(e.target.id==='rFloor'){r.floor=e.target.value;r.updated=Date.now();save()}
  if(e.target.id==='rNotes'){r.notes=e.target.value;r.updated=Date.now();save()}
});

/* ---------------- boot ---------------- */
(async function(){
  let readFailed=false;
  try{
    await openDB();
    const saved=await idbGet('kv','state');
    if(saved && !Array.isArray(saved.rooms)){
      // Something is there but unreadable. Keep a copy and refuse to write over it.
      try{ await idbPut('kv',{ts:Date.now(),raw:saved},'state.unreadable'); }catch(e){}
      throw new Error('corrupt');
    }
    if(saved && Array.isArray(saved.rooms)){
      state=Object.assign(state,saved);
      if(typeof state.property!=='string'||!state.property) state.property='Home Away Inn';
      normalizeStandard();
      normalizeDeleted();
      state.rooms=state.rooms.filter(r=>r&&typeof r==='object').map(normalizeRoom);
      state.rooms=state.rooms.filter(r=>!isDeleted(r.id));
      if(!state.stdSeeded && !standardIsSet()){ state.standard.all=[...DEFAULT_STANDARD]; state.stdSeeded=true; save(); }
      if(standardIsSet()) state.stdSeeded=true;
    }
  }catch(e){ readFailed=true; }
  normalizeStandard();

  if(readFailed){
    document.getElementById('boardEmpty').classList.add('hidden');
    document.getElementById('board').innerHTML=
      `<div class="warnbar" style="grid-column:1/-1">
        <strong>Could not read saved data.</strong> Nothing has been written over — your rooms may still be there.
        Close every other tab running this app and reload the page. If it keeps failing, check that the browser
        is not in private mode. Editing is switched off until a clean read succeeds.
      </div>`;
    document.getElementById('fab').style.display='none';
    return;   // loadOK stays false, so nothing can overwrite what is stored
  }

  /* Opened straight from a downloaded file. Every copy in the Downloads
     folder — room-survey.html, room-survey-1.html and so on — is a separate
     app with separate storage. This is how ten rooms went missing. */
  try{
    if(location.protocol==='file:'){
      const fname=decodeURIComponent((location.pathname||'').split('/').pop()||'this file');
      const numbered=/-\d+\.html?$/i.test(fname);
      const w=document.getElementById('fileWarn');
      w.innerHTML=`<strong>Running from a downloaded file: ${esc(fname)}</strong><br>
        Data is tied to this exact file. Opening a differently named copy shows an empty survey —
        the rooms are still under the old file, not lost.
        ${numbered?'<br><strong>This name ends in a number, so an earlier copy exists in Downloads and probably holds your rooms.</strong>':''}
        <br>Before switching copies: Menu → Save backup file, then Restore in the new one.
        Better still, host it at one web address and always open that.`;
      w.classList.remove('hidden');
    }
  }catch(e){}

  loadOK=true;

  if(!state.rooms.length && state.seedApplied!==SEED_ID){
    const n=await applySeed();
    if(n){
      const w=document.getElementById('backupWarn');
      w.innerHTML=`<strong>Loaded your recovered survey — ${n} rooms, ${state.rooms.reduce((a,r)=>a+r.photos.length,0)} photos.</strong><br>
        This is the backup from 20 Aug. If you had newer work than that, it is under a different copy of the app —
        check before adding to this one. From here on, save a backup after every session.`;
      w.classList.remove('hidden');
      w.dataset.seeded='1';
    }
  }

  if(!state.stdSeeded && !standardIsSet()){ state.standard.all=[...DEFAULT_STANDARD]; state.stdSeeded=true; save(); }
  await snapshot('startup');
  showBoard();
  syncNow(true);
  try{
    const orphans=(await idbAll('photos')).length;
    const linked=state.rooms.reduce((n,r)=>n+r.photos.length,0);
    if(!state.rooms.length && orphans>0){
      toast(`${orphans} photos found with no rooms — Menu → Recover`);
    } else if(orphans-linked>5){
      toast(`${orphans-linked} unlinked photos — Menu → Recover may restore them`);
    }
  }catch(e){}
})();
</script>
