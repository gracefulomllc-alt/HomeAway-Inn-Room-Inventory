[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # provided by the Netlify runtime — do not try to bundle it from node_modules
  external_node_modules = ["@netlify/blobs"]

# belt and braces: works whether or not the function's own path config applies
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200
  force = true
